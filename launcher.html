<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Chunk Client 1.24.2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #00d4ff;
            --secondary: #00a8cc;
            --background: #1e1e2e;
            --surface: #2d2d44;
            --text: #e0e0e0;
            --text-muted: #a0a0a0;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--background) 0%, var(--surface) 100%);
            color: var(--text);
        }

        #app {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px 30px;
            border-bottom: 2px solid var(--primary);
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 28px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .badge {
            background: var(--primary);
            color: var(--background);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
        }

        .footer {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-top: 1px solid var(--surface);
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-muted);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--background);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 212, 255, 0.3);
        }

        .btn-secondary {
            background: var(--surface);
            color: var(--primary);
            border: 2px solid var(--primary);
            margin-right: 10px;
        }

        .btn-secondary:hover {
            background: rgba(0, 212, 255, 0.1);
        }

        h2 {
            color: var(--primary);
            margin-bottom: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .card {
            background: var(--surface);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 8px;
            padding: 15px;
            transition: all 0.3s;
        }

        .card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .card-title {
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 5px;
        }

        .card-desc {
            font-size: 12px;
            color: var(--text-muted);
        }

        .toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            cursor: pointer;
        }

        input[type="checkbox"] {
            accent-color: var(--primary);
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="header">
            <h1>⚡ Chunk Client 1.24.2</h1>
            <div class="badge">v1.24.2 + MODS</div>
        </div>

        <div class="content" id="content"></div>

        <div class="footer">
            <div>FPS: 60 | Memory: 256MB | Ping: 0ms</div>
            <div>Chunk Client © 2026</div>
        </div>
    </div>

    <script>
        const mods = [
            { name: 'Performance Boost', desc: 'Auto-optimize rendering', enabled: false },
            { name: 'Zoom', desc: 'Ctrl+Scroll to zoom', enabled: false },
            { name: 'Brightness', desc: 'Adjust brightness', enabled: false },
            { name: 'Toggle Sneak', desc: 'Press C to sneak', enabled: false },
            { name: 'FPS Limiter', desc: 'Cap FPS to save power', enabled: false },
            { name: 'Better Chat', desc: 'Enhanced chat', enabled: false },
            { name: 'Waypoints', desc: 'Mark locations', enabled: false },
            { name: 'Inventory Sorter', desc: 'Auto-sort items', enabled: false },
            { name: 'Minimap', desc: 'Live world map', enabled: false },
            { name: 'Custom UI', desc: 'Customize look', enabled: false },
        ];

        let currentPage = 'main';

        function renderMain() {
            document.getElementById('content').innerHTML = `
                <div>
                    <h2>🎮 Welcome to Chunk Client</h2>
                    <p style="margin-bottom: 20px;">The ultimate Eaglercraft 1.14 client with superior performance + mods!</p>
                    
                    <div>
                        <button class="btn btn-primary" onclick="playGame()">🎮 Play Game</button>
                        <button class="btn btn-secondary" onclick="showMods()">📦 Mods</button>
                        <button class="btn btn-secondary" onclick="showSettings()">⚙️ Settings</button>
                    </div>
                    
                    <h2 style="margin-top: 40px;">✨ Features</h2>
                    <div class="grid">
                        <div class="card">
                            <div class="card-title">⚡ 40% Faster</div>
                            <div class="card-desc">Optimized chunk loading</div>
                        </div>
                        <div class="card">
                            <div class="card-title">📦 10+ Mods</div>
                            <div class="card-desc">Enhance your gameplay</div>
                        </div>
                        <div class="card">
                            <div class="card-title">🎨 Custom UI</div>
                            <div class="card-desc">Modern design</div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderMods() {
            const enabledCount = mods.filter(m => m.enabled).length;
            let html = `<h2>📦 Mods (${enabledCount}/${mods.length})</h2>`;
            html += '<div class="grid">';
            
            mods.forEach((mod, i) => {
                html += `
                    <div class="card">
                        <div class="card-title">📦 ${mod.name}</div>
                        <div class="card-desc">${mod.desc}</div>
                        <div class="toggle" onclick="toggleMod(${i})">
                            <input type="checkbox" ${mod.enabled ? 'checked' : ''} disabled>
                            <span>${mod.enabled ? '✅ Enabled' : '❌ Disabled'}</span>
                        </div>
                    </div>
                `;
            });
            
            html += '</div><button class="btn btn-secondary" onclick="showMain()">← Back</button>';
            document.getElementById('content').innerHTML = html;
        }

        function renderSettings() {
            document.getElementById('content').innerHTML = `
                <h2>⚙️ Settings</h2>
                <div class="card" style="max-width: 400px; margin-bottom: 20px;">
                    <div style="margin-bottom: 15px;">
                        <label style="display: block; margin-bottom: 10px;">Render Distance: <strong>8</strong></label>
                        <input type="range" min="4" max="16" value="8" style="width: 100%;">
                    </div>
                    <div style="margin-bottom: 15px;">
                        <label style="display: block; margin-bottom: 10px;">Max FPS:</label>
                        <select style="width: 100%; padding: 8px; background: var(--background); color: var(--text); border: 1px solid var(--primary); border-radius: 4px;">
                            <option>30</option>
                            <option selected>60</option>
                            <option>120</option>
                            <option>Unlimited</option>
                        </select>
                    </div>
                </div>
                <button class="btn btn-primary" onclick="alert('Settings saved!')">✓ Save</button>
                <button class="btn btn-secondary" onclick="showMain()">← Back</button>
            `;
        }

        function showMain() {
            currentPage = 'main';
            renderMain();
        }

        function showMods() {
            currentPage = 'mods';
            renderMods();
        }

        function showSettings() {
            currentPage = 'settings';
            renderSettings();
        }

        function toggleMod(index) {
            mods[index].enabled = !mods[index].enabled;
            renderMods();
        }

        function playGame() {
            const enabled = mods.filter(m => m.enabled).map(m => m.name).join(', ');
            alert('🎮 Game launching...\nEnabled mods: ' + (enabled || 'None'));
        }

        renderMain();
    </script>
</body>
</html>
